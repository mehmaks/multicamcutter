# ============================================================
# MULTICAM EDL WORKFLOW v3.0 - CONFIGURATION
# ============================================================

[General]
# Default Sensitivität für Reaktionserkennung
# Optionen: low, medium, high
default_sensitivity = medium

# Timeline Framerate (sollte zu deinem Resolve-Projekt passen)
timeline_fps = 25

# Minimale Shot-Dauer (Sekunden) - verhindert zu schnelle Schnitte
# Zeit die mindestens zwischen zwei Schnitten liegen muss
min_shot_duration = 3.0

# Minimale Zeit auf Reaktion bevor zurück geschnitten wird (Sekunden)
# Wie lange der Cutaway mindestens dauert
reaction_min_duration = 1.8

# Maximale Shot-Dauer (Sekunden) - erzwingt Cutaway bei langen Shots
# Auch ohne Reaktion wird nach dieser Zeit zur anderen Kamera geschnitten
max_shot_duration = 14.0

# Cleanup: Minimale Event-Dauer (Sekunden) - Events kürzer als dieser Wert werden in Pass 4 entfernt
cleanup_min_duration = 1.8

# ============================================================
# RMS DIARIZATION (Sprecherwechsel-Erkennung aus Audio)
# ============================================================

[RMSDiarization]
# Mindest-Segmentdauer (Sekunden) — Segmente kürzer als dieser Wert werden
# mit dem Nachbarsegment zusammengeführt.
# Niedriger = feinere Schnitte, höher = stabilere längere Blöcke
min_edit_duration = 1.0

# Smoothing-Delay (Sekunden) — ein Sprecherwechsel muss so lange anhalten
# bevor er als Wechsel gilt. Verhindert kurze Fehldetektionen.
change_delay = 0.3

# Dominanz-Schwelle (dB) — wie viel lauter ein Mikrofon sein muss
# damit es als aktiver Sprecher gilt. Höher = weniger Wechsel.
threshold_db = 6.0

# ============================================================
# DETECTION SETTINGS
# ============================================================

[Detection]
# Minimale Confidence für Reaktionen (0.0 - 1.0)
# Niedrigerer Wert = mehr Detektionen, aber mehr False Positives
min_confidence = 0.88

# Cooldown zwischen gleichen Reaktionen (in Frames)
# Verhindert Doppel-Detektionen derselben Reaktion
reaction_cooldown_frames = 35

# ============================================================
# NODDING (NICKEN) DETECTION
# ============================================================

[Nodding]
# Nicken-Erkennung aktivieren
enabled = true

# Minimale Nicken-Dauer (Sekunden)
# Bewegung muss mindestens so lange andauern um als Nicken zu gelten
# WICHTIG gegen False Positives!
min_nod_duration = 0.65

# Mindest-Abstand zwischen zwei Nodding-Events in Frames (v2.4)
# Höher = weniger False Positives durch Drift-Loops
# 35 Frames = 1.4s bei 25fps (war vorher hardcoded auf 15)
cooldown_frames = 35

# Minimale Kopfbewegung für Nicken (in Pixeln bei 720p)
# Wird automatisch für höhere Auflösungen skaliert
# Niedriger = sensibler (mehr Detektionen, mehr False Positives)
# Höher = nur deutliche Nicken
threshold_low = 130
threshold_medium = 100
threshold_high = 70

# ============================================================
# CUTAWAY TIMING
# ============================================================

[CutawayTiming]
# Maximaler Frame-Abstand zwischen zwei Events damit sie zum selben Cluster gehören.
# Beim Schnitt wird zum ERSTEN Event des Clusters zurückgegangen (Pre-Roll).
# 75 Frames = 3s bei 25fps
cluster_max_gap_frames = 75

# Fixer Pre-Roll: cutaway_frame wird um diese Frames nach vorne verschoben.
# Kompensiert die Erkennungs-Latenz des Detectors (History-Buffer ~30 Frames).
# Wird nach der Cluster-Suche angewendet — also für alle Cutaways.
# 15 Frames = 0.6s bei 25fps
pre_roll_frames = 15

# ============================================================
# LAUGHING (LACHEN) DETECTION
# ============================================================

[Laughing]
# Lach-Erkennung aktivieren (aktuell nicht verwendet)
enabled = false

# Multiplikator für Mundöffnung vs Baseline
threshold_low = 1.7
threshold_medium = 1.5
threshold_high = 1.3

# ============================================================
# HEAD SHAKE (KOPFSCHÜTTELN) DETECTION
# ============================================================

[HeadShake]
# Kopfschütteln-Erkennung aktivieren (aktuell nicht verwendet)
enabled = false

# Minimale horizontale Bewegung in Pixeln
threshold = 25

# ============================================================
# EYEBROW RAISE (AUGENBRAUEN) DETECTION
# ============================================================

[EyebrowRaise]
# Augenbrauen-Hochziehen-Erkennung aktivieren (aktuell nicht verwendet)
enabled = false

# Multiplikator für Augenbrauen-Distanz
threshold = 1.3

# ============================================================
# REAKTIONS-BASIERTE CUTAWAYS
# ============================================================

[ReactionCutaways]
# Welche erkannten Reaktionen sollen zu Cutaways führen?
# enabled = false bedeutet: Reaktion wird erkannt, aber nicht für Schnitte genutzt

# Nicken → Cutaway (zeigt Zuhörer-Bestätigung)
nodding_cutaway = true

# Lachen → Cutaway (zeigt Zuhörer-Reaktion)
laughing_cutaway = false

# Kopfschütteln → Cutaway
headshake_cutaway = false

# Augenbrauen → Cutaway
eyebrow_cutaway = false
